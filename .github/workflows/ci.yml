name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Environment
        run: node --version && npm --version

      - name: Install
        run: |
          set +e
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::npm ci failed: $(grep -iE 'npm error|npm ERR' /tmp/npm.log | head -8 | tr '\n' ' | ' | cut -c1-800)"
          fi
          exit "$code"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    defaults:
      run:
        working-directory: Backend-Contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage
        run: forge coverage --no-match-coverage "script" --report summary
