[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[fuzz]
runs = 256

# Default depth (500) puts the invariant suite at ~100s, which is too slow to run
# on every push. 128 x 100 still exercises ~12.8k random call sequences.
[invariant]
runs = 128
depth = 100
fail_on_revert = false

# The CI workflow sets FOUNDRY_PROFILE=ci. Search harder there than locally,
# where the suite is run on every change and needs to stay fast.
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 250
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
